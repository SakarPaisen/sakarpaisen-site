# Netlify yapılandırması
# Bu dosya olduğu gibi durur; Netlify sitenizi yayınlarken otomatik okur.

[build]
  # Derleme adımı yok: saf statik site. Klasör doğrudan yayınlanır.
  publish = "."

# Service worker ve manifest'in doğru MIME ile ve önbelleksiz sunulması
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# HTML dosyaları hemen güncellensin (yeni sürüm yayınlanınca kullanıcı eskisini görmesin)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Resimler ve yazı tipleri uzun önbelleklenebilir (içerik değişmiyor)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/alfabe/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Güvenlik başlıkları
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
